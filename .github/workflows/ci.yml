name: BetRally CI/CD & Automated 1800 Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # 1. DJANGO BACKEND TESTS & 1,800 AUTOMATED VALIDATION SUITE
  # --------------------------------------------------------------------------
  backend-tests:
    name: Django Tests & 1,800 Validation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django Unit & Integration Tests
        run: |
          cd backend
          python manage.py test

      - name: Execute Full 1,800 Test Cases Suite
        run: |
          python tests/run_1800_suite.py

  # --------------------------------------------------------------------------
  # 2. FLUTTER FRONTEND STATIC ANALYSIS, WIDGET TESTS & WEB BUILD
  # --------------------------------------------------------------------------
  frontend-tests:
    name: Flutter Lint, Widget Tests & Web Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Flutter Static Analysis
        run: |
          cd mobile_app
          flutter analyze

      - name: Flutter Widget & Screen Tests
        run: |
          cd mobile_app
          flutter test

      - name: Compile Flutter Web Release
        run: |
          cd mobile_app
          flutter build web --release --no-pub

